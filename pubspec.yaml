name: github_users
description: "GitHub users list test task"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Networking
  dio: ^5.11.1
  retrofit: ^4.10.0
  connectivity_plus: ^7.3.2

  # JSON serialization
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  #  Localization
  easy_localization: ^3.0.8

  # Image 
  cached_network_image: ^4.0.6
  flutter_svg: ^2.3.2


  # Routing
  auto_route: ^11.2.0

  #  DI
  get_it: ^9.3.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.3
  freezed: ^4.0.1
  auto_route_generator: ^10.6.0
  retrofit_generator: ^10.3.3
  json_serializable: ^6.15.2

  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/png/
    - assets/translations/


flutter_native_splash:
  color: "#FFFFFF"
  image: assets/png/logo.png
  color_dark: "#121212"
  image_dark: assets/png/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/png/logo.png    